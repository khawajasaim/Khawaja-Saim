<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio form test</title>
<style>body{margin:0;background:#101419;color:#e5eafe;font:17px/1.6 system-ui}main{max-width:580px;margin:auto;padding:32px 20px}header{min-height:110vh}label,input{display:block}input,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0 15px;border-radius:8px;font:inherit}button{cursor:pointer}form{padding-bottom:140px}</style>
<main><header><h1>Portfolio form test</h1><p>Accept analytics, then scroll down to the form. Use a fictional name and test email.</p></header>
<form><h2>Test contact</h2><label>Name<input name="contactName" maxlength="80" required></label><label>Email<input type="email" name="contactEmail" maxlength="254" required></label><p>Submitting saves your test name, email and visitor ID in the portfolio CRM.</p><button>Submit test contact</button><output role="status"></output></form></main>
<script src="./visitor-tracker.js"></script>
<script>
const form = document.querySelector("form");
const status = form.querySelector("output");
const setup = new URLSearchParams(location.hash.slice(1));
const target = setup.get("crm");
const nonce = setup.get("run");
let receiver;
try { receiver = new URL(target); } catch {}
const valid = receiver && ["localhost","127.0.0.1"].includes(receiver.hostname) &&
  ["http:","https:"].includes(receiver.protocol) && receiver.origin === target && nonce && window.opener;
form.addEventListener("submit", async event => {
  event.preventDefault();
  const button = form.querySelector("button");
  if (button.disabled) return;
  const visitorId = localStorage.getItem("portfolio_crm_visitor_id_v1");
  if (!visitorId || localStorage.getItem("portfolio_crm_analytics_consent_v1") !== "granted") {
    status.textContent = "Accept analytics before submitting this tracked test."; return;
  }
  const contact = {visitorId,name:form.elements.contactName.value.trim(),email:form.elements.contactEmail.value.trim()};
  button.disabled = true;
  status.textContent = "Saving…";
  try {
    for (let attempt=0; attempt<4; attempt++) {
      const response = await fetch("https://xqhzcyebrtgsjxgwnhsp.supabase.co/functions/v1/portfolio-form", {
        method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...contact,consent:true})
      });
      const state = await response.text();
      if (response.ok && state === "saved") {
        status.textContent = "Saved to CRM.";
        if (valid && !window.opener.closed) window.opener.postMessage({type:"crm-form-contact",run:nonce,...contact},target);
        return;
      }
      if (response.status === 409 && attempt < 3) {
        await new Promise(resolve=>setTimeout(resolve,1000*(attempt+1))); continue;
      }
      throw new Error(response.status===409 ? "Visit has not reached the tracker. Reload the page and try again." :
        response.status===429 ? "Submission limit reached. Try again later." : "Unable to save. Please try again.");
    }
  } catch (error) {
    status.textContent = error.message;
    button.disabled = false;
  }
});
</script></html>
